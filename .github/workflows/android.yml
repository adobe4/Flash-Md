name: Build Vinakili APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug + release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Vinakili-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Vinakili-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinakili-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/vinakili-android-app-o3aimf' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vinakili — latest build
          body: |
            Automated Vinakili APK build from ${{ github.sha }}.
            Download **Vinakili-release.apk** and install on your Android device
            (enable "Install unknown apps" for your browser/file manager first).
          files: dist/*.apk
          fail_on_unmatched_files: true
